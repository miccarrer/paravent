[project]
name = "paravent"
version = "0.1.0"
description = "Constitue un corpus Markdown à partir de documents personnels, et son miroir anonymisé."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pypdfium2>=5.13",
    "rapidocr>=3.9",
    "onnxruntime>=1.30",
    "pillow>=12.3",
    "python-docx>=1.2",
]

[project.scripts]
paravent = "paravent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "rapid-layout>=1.2.1",
    "rapid-table>=3.0.2",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
